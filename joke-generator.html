<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Joke Generator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 600px;
            width: 100%;
            padding: 40px;
            text-align: center;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 2.5em;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 0.9em;
        }

        .joke-box {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 30px;
            min-height: 150px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            animation: slideIn 0.5s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .joke-text {
            font-size: 1.3em;
            line-height: 1.6;
            margin-bottom: 15px;
        }

        .joke-type {
            font-size: 0.9em;
            opacity: 0.8;
            font-style: italic;
        }

        .button-group {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }

        button {
            padding: 15px 30px;
            font-size: 1em;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
            min-width: 150px;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .btn-secondary {
            background: #f0f0f0;
            color: #333;
            border: 2px solid #667eea;
        }

        .btn-secondary:hover {
            background: #667eea;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .loading {
            display: none;
            font-size: 1.2em;
            color: #667eea;
        }

        .spinner {
            border: 4px solid #f0f0f0;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .category-filter {
            margin-bottom: 20px;
        }

        .category-filter label {
            color: #666;
            margin-right: 10px;
            font-weight: 500;
        }

        .category-filter select {
            padding: 10px 15px;
            border: 2px solid #667eea;
            border-radius: 8px;
            font-size: 1em;
            cursor: pointer;
            background: white;
            color: #333;
        }

        .copy-btn {
            background: #00b894;
            color: white;
            padding: 10px 20px;
            font-size: 0.9em;
            margin-top: 10px;
        }

        .copy-btn:hover {
            background: #00a383;
        }

        .copy-feedback {
            color: #00b894;
            font-size: 0.9em;
            margin-top: 10px;
            display: none;
        }

        .error-message {
            color: #ff7675;
            background: #ffe0e0;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: none;
        }

        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }

            h1 {
                font-size: 1.8em;
            }

            .joke-text {
                font-size: 1.1em;
            }

            button {
                padding: 12px 20px;
                font-size: 0.9em;
                min-width: 120px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>😂 Joke Generator</h1>
        <p class="subtitle">Get a random joke to brighten your day!</p>

        <div class="error-message" id="errorMessage"></div>

        <div class="category-filter">
            <label for="category">Category:</label>
            <select id="category">
                <option value="random">Random</option>
                <option value="general">General</option>
                <option value="programming">Programming</option>
                <option value="knock-knock">Knock-Knock</option>
            </select>
        </div>

        <div class="joke-box">
            <div class="loading" id="loading">
                <div class="spinner"></div>
                Loading a funny joke...
            </div>
            <div id="jokeContent">
                <p class="joke-text" id="jokeText">Click "Get Joke" to start laughing!</p>
                <p class="joke-type" id="jokeType"></p>
            </div>
        </div>

        <div class="button-group">
            <button class="btn-primary" onclick="getJoke()">Get Joke</button>
            <button class="btn-secondary" onclick="copyJoke()">📋 Copy</button>
        </div>

        <button class="copy-btn" onclick="shareJoke()">Share Joke</button>
        <div class="copy-feedback" id="copyFeedback">Copied to clipboard! ✓</div>
    </div>

    <script>
        let currentJoke = '';
        let currentType = '';

        async function getJoke() {
            const category = document.getElementById('category').value;
            const loading = document.getElementById('loading');
            const jokeContent = document.getElementById('jokeContent');
            const errorMessage = document.getElementById('errorMessage');

            loading.style.display = 'block';
            jokeContent.style.display = 'none';
            errorMessage.style.display = 'none';

            try {
                let url = '';

                if (category === 'random') {
                    // Use Official Joke API - Random joke
                    url = 'https://official-joke-api.appspot.com/random_joke';
                } else if (category === 'general') {
                    // General joke
                    url = 'https://official-joke-api.appspot.com/jokes/general/random';
                } else if (category === 'programming') {
                    // Programming joke
                    url = 'https://official-joke-api.appspot.com/jokes/programming/random';
                } else if (category === 'knock-knock') {
                    // Knock-knock joke
                    url = 'https://official-joke-api.appspot.com/jokes/knock-knock/random';
                }

                const response = await fetch(url);

                if (!response.ok) {
                    throw new Error('Failed to fetch joke');
                }

                const joke = await response.json();

                // Handle single joke or array of jokes
                const jokeData = Array.isArray(joke) ? joke[0] : joke;

                currentJoke = jokeData.setup ? `${jokeData.setup} ${jokeData.punchline}` : jokeData.joke;
                currentType = jokeData.type || category;

                displayJoke(currentJoke, currentType);

            } catch (error) {
                console.error('Error fetching joke:', error);
                errorMessage.textContent = '❌ Oops! Could not fetch a joke. Please try again!';
                errorMessage.style.display = 'block';
                jokeContent.style.display = 'none';
            } finally {
                loading.style.display = 'none';
            }
        }

        function displayJoke(joke, type) {
            const jokeText = document.getElementById('jokeText');
            const jokeType = document.getElementById('jokeType');
            const jokeContent = document.getElementById('jokeContent');

            jokeText.textContent = joke;
            jokeType.textContent = `Type: ${type}`;
            jokeContent.style.display = 'block';
        }

        function copyJoke() {
            if (!currentJoke) {
                alert('Please get a joke first!');
                return;
            }

            navigator.clipboard.writeText(currentJoke).then(() => {
                const feedback = document.getElementById('copyFeedback');
                feedback.style.display = 'block';
                setTimeout(() => {
                    feedback.style.display = 'none';
                }, 2000);
            }).catch(err => {
                console.error('Failed to copy:', err);
                alert('Failed to copy to clipboard');
            });
        }

        function shareJoke() {
            if (!currentJoke) {
                alert('Please get a joke first!');
                return;
            }

            if (navigator.share) {
                navigator.share({
                    title: 'Check out this joke!',
                    text: currentJoke,
                }).catch(err => console.log('Error sharing:', err));
            } else {
                copyJoke();
                alert('Joke copied! Share it with your friends.');
            }
        }

        // Load a joke when page loads
        window.addEventListener('load', () => {
            getJoke();
        });

        // Allow Enter key to get new joke
        document.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                getJoke();
            }
        });
    </script>
</body>
</html>
